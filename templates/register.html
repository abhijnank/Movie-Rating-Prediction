<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MoviePredict</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #07152e;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 430px;
            background: #0b1e3d;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #334b70;
            border-radius: 6px;
            background: #07152e;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            background: #17365e;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 5px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            color: #cbd5e1;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>Create Account</h1>
        <p class="subtitle">Register to MoviePredict</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <label>Username</label>
            <input type="text" name="username"
                   placeholder="Enter username" required>

            <label>Email</label>
            <input type="email" name="email"
                   placeholder="Enter email address" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Create password" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password"
                   placeholder="Confirm password" required>

            <button type="submit">Register</button>

        </form>

        <div class="links">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

        <a class="home" href="{{ url_for('index') }}">Back to Home</a>

    </div>

</body>
</html>
