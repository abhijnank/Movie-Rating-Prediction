<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - MoviePredict</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #07152e;
            color: white;
            min-height: 100vh;
        }

        nav {
            background: #0b1e3d;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #0b1e3d;
            border-radius: 12px;
            border: 1px solid #1e3a5f;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-item {
            padding: 18px;
            margin-bottom: 15px;
            background: #07152e;
            border-radius: 7px;
            border: 1px solid #334b70;
        }

        .profile-item span {
            color: #93c5fd;
            display: block;
            margin-bottom: 8px;
        }

        .profile-item strong {
            font-size: 17px;
            overflow-wrap: anywhere;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .actions {
            text-align: center;
        }
    </style>
</head>

<body>

    <nav>
        <h2>MoviePredict</h2>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
    </nav>

    <div class="container">

        <h1>My Profile</h1>

        <p class="subtitle">
            Your account information
        </p>

        <div class="profile-item">
            <span>Username</span>
            <strong>{{ user['username'] }}</strong>
        </div>

        <div class="profile-item">
            <span>Email Address</span>
            <strong>{{ user['email'] }}</strong>
        </div>

        <div class="profile-item">
            <span>Account Role</span>
            <strong>{{ user['role'] }}</strong>
        </div>

        <div class="profile-item">
            <span>Total Predictions</span>
            <strong>{{ prediction_count }}</strong>
        </div>

        <div class="actions">
            <a href="{{ url_for('dashboard') }}" class="btn">
                Back to Dashboard
            </a>

            <a href="{{ url_for('logout') }}" class="btn">
                Logout
            </a>
        </div>

    </div>

</body>
</html>
