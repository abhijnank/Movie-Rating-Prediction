
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Movie Rating Predictor Pro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #071a2e;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }

        .register-container {
            width: 430px;
            max-width: 92%;
            padding: 38px;
            background: #102b46;
            border: 1px solid #244968;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin: 10px 0;
            color: #ffffff;
        }

        .subtitle {
            text-align: center;
            color: #b8c9dc;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2edf8;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #345875;
            border-radius: 8px;
            outline: none;
            background: #0a2037;
            color: #ffffff;
            font-size: 14px;
        }

        input:focus {
            border-color: #38a6e8;
            box-shadow: 0 0 0 2px rgba(56, 166, 232, 0.15);
        }

        input::placeholder {
            color: #91a8bd;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #58b7f0;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #168bd0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #0875b8;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #c0d0df;
            font-size: 14px;
        }

        .login-link a {
            color: #55b9f2;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 11px;
            margin-bottom: 15px;
            border-radius: 7px;
            background: #183e58;
            color: #ffffff;
            font-size: 13px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #829bb2;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">🎬</div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Join Movie Rating Predictor Pro
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
                minlength="3"
                autocomplete="username">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
                autocomplete="email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                    autocomplete="new-password">

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('password', this)">
                    Show
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                    autocomplete="new-password">

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('confirm_password', this)">
                    Show
                </button>
            </div>
        </div>

        <button type="submit" class="register-btn">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="{{ url_for('login') }}">Login Here</a>
    </div>

    <div class="footer">
        © 2026 Movie Rating Predictor Pro
    </div>

</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "Hide";
        } else {
            input.type = "password";
            button.textContent = "Show";
        }
    }
</script>

</body>
</html>
