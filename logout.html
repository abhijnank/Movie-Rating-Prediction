<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout | Movie Rating Predictor Pro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1c30;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .logout-card {
            width: 100%;
            max-width: 460px;
            padding: 40px 30px;
            text-align: center;
            background: #142d49;
            border: 1px solid #294967;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
        }

        .logout-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #244e76;
            color: #ffffff;
            font-size: 35px;
        }

        .logout-card h1 {
            color: #ffffff;
            font-size: 27px;
            margin: 0 0 12px;
        }

        .logout-card p {
            color: #a9bfd8;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .logout-actions {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .logout-btn {
            display: block;
            padding: 14px 20px;
            background: #2465a0;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #327fbd;
            transform: translateY(-2px);
        }

        .logout-btn.secondary {
            background: #294967;
        }

        .logout-btn.secondary:hover {
            background: #365d7e;
        }

        .copyright {
            color: #7892ad;
            font-size: 12px;
            margin-top: 28px;
        }

        @media (max-width: 480px) {
            .logout-card {
                padding: 32px 20px;
            }

            .logout-card h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="logout-card">

        <div class="logout-icon">✓</div>

        <h1>You Have Logged Out</h1>

        <p>
            Thank you for using Movie Rating Predictor Pro.
            Your session has ended successfully.
        </p>

        <div class="logout-actions">

            <a href="{{ url_for('login') }}" class="logout-btn">
                Login Again
            </a>

            <a href="{{ url_for('register') }}"
               class="logout-btn secondary">
                Create New Account
            </a>

        </div>

        <div class="copyright">
            © 2026 Movie Rating Predictor Pro. All rights reserved.
        </div>

    </div>

</body>
</html>
