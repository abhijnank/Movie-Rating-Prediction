{% extends "base.html" %}

{% block title %}Login | Movie Rating Prediction{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p class="auth-description">
            Login to your Movie Rating Prediction account.
        </p>

        <form method="POST">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Login
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register Here</a>
        </p>

        <p class="auth-footer">
            <a href="{{ url_for('index') }}">Back to Home</a>
        </p>

    </div>

</section>

{% endblock %}
